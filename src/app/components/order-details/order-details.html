@if (state$ | async; as state) {

    <div class="order-detail-page page page--medium">
        @if (state.status === 'loading') {
            <p class="state-message">Caricamento in corso...</p>
        } @else if (state.status === 'error') {
            @if (state.code === 401) {
                <app-login-redirector></app-login-redirector>
            } @else {
                <div class="error-message">
                    <h2>Si è verificato un errore</h2
