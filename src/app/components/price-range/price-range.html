<div class="price-range">
  <div class="track" aria-hidden="true">
    <div class="track-base"></div>
    <div class="fill" [style.left.%]="lowPercent" [style.right.%]="100 - highPercent"></div>
  </div>

  <input
    class="range-input range-input--low"
    type="range"
    aria-label="Prezzo minimo"
    [min]="min"
    [max]="max"
    [step]="step"
    [value]="low"
    (input)="onLowInput($any($event.target).value)"
  />

  <input
    class="range-input range-input--high"
    type="range"
    aria-label="Prezzo massimo"
    [min]="min"
    [max]="max"
    [step]="step"
    [value]="high"
    (input)="onHighInput($any($event.target).value)"
  />

  <div class="labels">
    <div>€{{ low }}</div>
    <div>€{{ high }}</div>
  </div>
</div>
